name: Daily log

# Appends one dated line to log/daily.md each day, from 26 to 29 Nov 2026,
# then stops on its own. Runs at 06:30 UTC (12:00 IST).
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Check the date window
        id: window
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [[ "$today" > "2026-11-29" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'

      - name: Append and commit
        if: steps.window.outputs.run == 'true'
        # Commit in IST so the contribution graph files it under the IST date.
        env:
          TZ: Asia/Kolkata
        run: |
          today="${{ steps.window.outputs.today }}"
          mkdir -p log
          grep -qx -- "- $today" log/daily.md 2>/dev/null && { echo "Already logged $today"; exit 0; }
          echo "- $today" >> log/daily.md
          git config user.name "Aniket Chavan"
          git config user.email "91446947+Aniketchavan7@users.noreply.github.com"
          git add log/daily.md
          git commit -m "log: $today"
          git push
